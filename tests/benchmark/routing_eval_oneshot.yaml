# Extension eval set for the oneshot-web-spec skill (tier3 measurement).
# Does NOT modify routing_eval_extended.yaml; run standalone or concatenated.
# Categories: oneshot_spec (must route), junk (must not route), adjacent (must not route).
- query: 帮我写一个贪吃蛇单页游戏的任务书
  expect:
  - oneshot-web-spec
  category: oneshot_spec
  note: real one-shot web game spec request (zh)
- query: write a one-shot spec for a markdown editor single-page web app, offline, no CDN
  expect:
  - oneshot-web-spec
  category: oneshot_spec
  note: real one-shot web app spec request (en)
- query: 帮我起草一个数据看板网站的建站规格书，要求 AI 一次性交付可运行的成品
  expect:
  - oneshot-web-spec
  category: oneshot_spec
  note: dashboard site spec, one-shot delivery (zh)
- query: 可以
  expect: []
  reject:
  - oneshot-web-spec
  category: junk
  note: junk counterexample, must not route to oneshot-web-spec
- query: ok
  expect: []
  reject:
  - oneshot-web-spec
  category: junk
  note: junk counterexample, must not route to oneshot-web-spec
- query: review 这个 PR
  expect: []
  reject:
  - oneshot-web-spec
  category: adjacent
  note: semantically adjacent (authoring-ish) but must NOT route to oneshot-web-spec
- query: 写一个 python 脚本统计日志里的错误码
  expect: []
  reject:
  - oneshot-web-spec
  category: adjacent
  note: code-writing request, not a web spec; must NOT route to oneshot-web-spec
# Held-out positives (Gate9 fix): paraphrases sharing NO literal phrases with the
# SKILL.md description/triggers — measures generalization, not description overlap.
- query: 想让 AI 从零直接做出一个能玩的五子棋网页，帮我把要交给它的详细要求写成一份说明
  expect:
  - oneshot-web-spec
  category: oneshot_spec_heldout
  note: held-out paraphrase (zh); avoids 任务书/规格书/需求文档/单页/一次性交付/建站
- query: draft the complete instructions I would hand to an AI so it builds a playable
    Tetris in the browser with no starter code, including objective pass/fail checks
  expect:
  - oneshot-web-spec
  category: oneshot_spec_heldout
  note: 'held-out paraphrase (en); avoids spec/brief/one-shot/single-page/web app/from scratch.
    RESULT: initially misrouted to omx/autoresearch-goal (semantic_index, 0.67) with the
    original description; after description enrichment + index rebuild it routes to
    oneshot-web-spec (semantic_index, 0.76).'
- query: compose a detailed requirement sheet an AI assistant can follow to produce a
    fully playable chess game in the browser, starting from an empty folder, with objectively
    verifiable checks
  expect:
  - oneshot-web-spec
  category: oneshot_spec_heldout
  note: held-out paraphrase (en), single allowed retry with different wording after the
    Tetris variant misrouted; still shares no literal phrases with description/triggers.
- query: 我有个互动星空动画页面的想法，想整理成可以直接发给 AI 执行的自包含任务说明，做完双击就能打开用
  expect:
  - oneshot-web-spec
  category: oneshot_spec_heldout
  note: held-out paraphrase (zh); avoids all trigger phrases and description examples

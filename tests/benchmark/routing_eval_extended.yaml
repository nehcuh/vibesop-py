# Extended routing eval set — human-audited labels (2026-08-19, gate10 nits converged).
#
# Provenance: weak-labeled from CMspark production triage logs (M1c,
# scripts/build_eval_from_logs.py), then audited per
# .omx/artifacts/tier3-eval-label-audit.md. All labels below are confirmed
# (needs_review: false); confirm via `build_eval_from_logs.py --merge` when
# ready to fold positives into routing_eval.yaml.
# Arithmetic: 130 raw entries = 107 scored here + 22 in
# routing_eval_retention.yaml + 1 dropped near-duplicate (the DMG-rebuild
# query appeared twice, differing only by a trailing 吧; the dropped one is
# the 吧-less variant). No other entry was removed.
#
# Label space & scoping: labels use only ids from this repo's registry
# namespaces (builtin/*, superpowers/*, omx/* per core/registry.yaml), in
# canonical `namespace/name` form. mattpocock/* and similar ids are NOT
# "unresolvable" — they exist in this machine's router candidate pool
# (measured: of 239 local candidates, 29 mattpocock / 46 omx /
# 14 superpowers / 7 ui-ux-pro-max-skill) — but were deliberately scoped
# OUT of the label catalog because they are user-local pack installs, not
# skills this repo ships or declares. Such entries were relabeled to [] or
# to the semantically correct in-catalog id.
#
# Environment dependence: routing runs against the LOCAL skill index
# (~/.vibe/skill-index.json) and learned instincts (.vibe/instincts.jsonl),
# so absolute scores vary by machine.
#
# requires_packs field (gate38; this field is the single source of truth for
# pack-environment dependence — the prose that used to live here is gone):
# entries whose expect labels live in an external skill pack carry
# `requires_packs: [<namespace>]`. scripts/eval_routing.py scores such an
# entry as skipped_env when it is annotated AND expect is non-empty AND
# every expect id is unresolvable in the current environment (builtin ids
# resolve from core/registry.yaml; external ids from ExternalSkillLoader
# discovery). skipped_env entries are excluded from total/denominator and
# from the errors list, and record ok1: null in per_query. If the presence
# check itself raises, ids count as resolvable (conservative: the entry is
# scored — possibly as a false error — never silently skipped). Annotated
# entries with expect: [] are NEVER skipped (a bare all([]) would
# vacuously skip every annotation).
#
# Residual noise disclosure — extended numbers are NOT a clean baseline:
# (a) reject-only entries (expect: [] with reject containing pack ids) pass
#     vacuously in a bare environment where the pack is absent, inflating
#     the measured pass rate;
# (b) the ~5 env-sensitive fallback-path entries noted in the pre-gate38
#     header are still unannotated and still count as errors on bare
#     machines — they are environment misses, not router regressions.
#
# Known labeling tension: `commit 三批改动` is labeled omx/git-master (a
# positive) while sibling git-ish queries (按批次拆 commit / 保存并提交远程 /
# push到远程) are [] — the difference is that the router actually produced a
# semantically-right omx/git-master match for the former and not for the
# siblings. Treat git-task labeling as unsettled until a repo-declared git
# skill exists.
#
# Semantics (scripts/eval_routing.py):
#   expect: [ids...]  — primary must be one of ids (top-1); recall@3 checks top-3.
#   expect: [] + reject: [ids...] — primary must NOT be any rejected id.
#   expect: [] with no reject — explicit NO-MATCH assertion: passes iff the
#       router produced no real skill match, i.e. RoutingResult.has_match is
#       False (primary is None or layer == fallback_llm; skill id
#       "fallback-llm" counts as no match).
#
# Low-signal and agent-to-agent entries were moved (not deleted) to
# routing_eval_retention.yaml for insight mining; they are NOT scored.

# Routing accuracy evaluation set (SOP §6.1).
# Each entry: query + expect (acceptable primary skill_ids) + optional reject.
# Covers: all builtin skills (CN/EN mix, long/short, noisy prefixes),
# cross-cutting skills, and adversarial near-miss cases.

- query: 帮我深度诊断这个项目的性能瓶颈并给出优化建议
  expect:
  - builtin/deep-diagnosis-optimization
  category: diagnosis
- query: run a deep diagnosis of the codebase and suggest optimizations
  expect:
  - builtin/deep-diagnosis-optimization
  category: diagnosis
- query: 全面审查这个仓库的代码质量
  expect:
  - builtin/deep-diagnosis-optimization
  category: diagnosis
- query: 让 agent 自主运行一组实验并汇报评估结果
  expect:
  - builtin/autonomous-experiment
  category: experiment
- query: start an autonomous experiment loop with prediction evaluation
  expect:
  - builtin/autonomous-experiment
  category: experiment
- query: 把最近踩过的坑沉淀下来，以后别再犯了

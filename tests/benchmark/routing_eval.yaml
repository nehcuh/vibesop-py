- query: help me write a unit test for this function
  expect: []
  reject:
  - builtin/slash-help
  category: adversarial
  note: help 前缀不应劫持到 slash-help（已知问题样本）
- query: help me fix this bug in the login flow
  expect: []
  reject:
  - builtin/slash-help
  category: adversarial
  note: 同上：help 是语气词不是求助命令
- query: 审计一下第三方依赖的供应链安全
  expect:
  - builtin/deep-diagnosis-optimization
  category: adversarial
- query: xyzq 什么都不相关的乱码查询 blargh
  expect: []
  category: adversarial
  note: 应 no-match / fallback

# In-universe external-pack load (gate45 P1): the checked-in
# tests/fixtures/benchmark-pack exercises pack-shaped skills inside the
# pinned hermetic universe — scored everywhere, never skipped_env.
- query: add this to the quokka-todo list before we forget
  expect:
  - benchpack/quokka-todo
  category: benchmark_pack
- query: take a wombat-snapshot of the workspace before the risky edit
  expect:
  - benchpack/wombat-snapshot
  category: benchmark_pack

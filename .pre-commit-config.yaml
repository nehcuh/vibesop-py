# Pre-commit hooks for Python development

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        # 8.3.1 (B-3): same gate shape as CI — plain-text exit codes, only
        # exit 0 passes (1=type errors, 3=config errors); warnings stay
        # advisory via --level error.
        entry: env PYRIGHT_DISABLE_GITHUB_ACTIONS_OUTPUT=1 uv run basedpyright --level error
        language: system
        types: [python]
        pass_filenames: false
      # Note: Pre-commit runs on every commit. Running 2,900+ tests here
      # makes commits unbearably slow and encourages --no-verify bypass.
      # Tests are enforced in CI and should be run locally via `make test`.
      # - id: pytest
      #   name: Run tests
      #   entry: uv run pytest tests/ -x -q --ignore=tests/benchmark
      #   language: system
      #   types: [python]
      #   pass_filenames: false
      #   always_run: true

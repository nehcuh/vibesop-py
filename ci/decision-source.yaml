# Lane B / B1 — CI decision-source registry
#
# Why this file exists
# -------------------
# `docs/ROADMAP.md` forbids using LLM review as a merge gate, but that ban is
# prose: nothing in the repo detects "this CI job decides on model output".
# This registry makes the rule machine-checkable — every job in
# `.github/workflows/ci.yml` must declare where its verdict comes from, and
# only `deterministic` (a program's exit code / exit-code-bearing tooling) or
# `human` (a person reads an artifact and decides) may gate a required job.
#
# `scripts/check_ci_decision_source.py` cross-checks this file against the
# workflow: unregistered job -> exit 1, registry entry with no job -> exit 1.
# The same script is a required CI job (`decision-source`).
#
# `routing-eval` is `human` because it is permanently report-only
# (`continue-on-error: true`) and exists to surface JSON for a person, never
# to block merges. Every other job, including this guard, is `deterministic`.
#
# Scope (this first registry)
# ---------------------------
# ONLY `.github/workflows/ci.yml`. Quickstart (`quickstart-e2e.yml`),
# release (`release.yml`), and CodeQL workflows stay outside this first
# registry. Do not add those jobs here.
#
# Honest limit
# ------------
# This registry records the claim; it does not verify it. Import-level
# static enforcement (a `deterministic` job may not import `anthropic` /
# `openai`) is B2 and is deliberately not implemented yet.

schema_version: 1
workflow: .github/workflows/ci.yml

jobs:
  lint:
    name: Lint
    decision_source: deterministic
    rationale: >-
      ruff's own exit code (`ruff check .`, `ruff format --check .`). No model
      output participates in the verdict.

  decision-source:
    name: Decision Source
    decision_source: deterministic
    rationale: >-
      `scripts/check_ci_decision_source.py` exit code against this registry
      and `.github/workflows/ci.yml`. No model output participates.

  type-check:
    name: Type Check
    decision_source: deterministic
    rationale: >-
      basedpyright exit codes under `--level error` (0 pass / 1 type errors /
      3 config error). Warnings are advisory by explicit rule, and that rule
      is a config decision (pyproject.toml [tool.pyright]), not a model call.

  test:
    name: Test (Python ${{ matrix.python-version }})
    decision_source: deterministic
    rationale: >-
      pytest exit code over the "not benchmark and not slow" marker filter,
      plus a hard coverage floor (`--cov-fail-under=73`).

  test-windows:
    name: Test Windows (Python ${{ matrix.python-version }})
    decision_source: deterministic
    rationale: >-
      pytest exit code on windows-latest, same marker filter. `--reruns 2`
      absorbs OS-level flakes (Defender scans, file-lock races) — a flake
      absorber, not a model judgement.

  security:
    name: Security Scan
    decision_source: deterministic
    rationale: >-
      pip-audit (venv + full lockfile export) and bandit exit codes. Advisory
      databases and CVEs change over time, so a re-run may flip — that is
      upstream data drift, not a model decision.

  benchmark:
    name: Performance Benchmark
    decision_source: deterministic
    rationale: >-
      pytest `-m benchmark` exit code. Absolute-µs budgets are load-sensitive,
      which is why `--reruns 2` exists; the budget check itself is arithmetic.

  routing-eval:
    name: Routing Eval (report-only)
    decision_source: human
    rationale: >-
      Permanently report-only (`continue-on-error: true`). The harness always
      exits 0 and runs the non-hermetic `--json` invocation; the job exists
      to surface JSON metrics for a person, never to block merges. The
      decision this job feeds is human. `continue-on-error` is not an
      exemption from source validation: the job still runs and is still read.

  routing-benchmark:
    name: Routing Benchmark (gate)
    decision_source: deterministic
    rationale: >-
      Hard gate (gate45 P1): `eval_routing.py --hermetic --check` exit codes
      0 ok / 1 new top-1 failure / 3 stale baseline. Hermetic posture pins
      cwd/project_root/HOME and the candidate universe, so the verdict is
      machine-independent.

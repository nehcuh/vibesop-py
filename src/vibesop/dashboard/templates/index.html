<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSOP Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #c9d1d9;
    --dim: #6e7681;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #a371f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .ver { font-size: 12px; color: var(--dim); }
  nav { display: flex; gap: 4px; margin-left: 24px; }
  nav button { background: none; border: none; color: var(--dim); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .15s; }
  nav button:hover { color: var(--text); background: rgba(255,255,255,.05); }
  nav button.active { color: var(--accent); background: rgba(88,166,255,.1); }
  .refresh { margin-left: auto; background: var(--accent); color: #fff; border: none; padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500; }
  .refresh:hover { opacity: .85; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: var(--green); }
  .status-dot.warn { background: var(--yellow); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
  .tab { display: none; }
  .tab.active { display: block; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card .label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .sub { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .value.green { color: var(--green); }
  .value.yellow { color: var(--yellow); }
  .value.red { color: var(--red); }
  .value.accent { color: var(--accent); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; background: var(--card); position: sticky; top: 0; }
  td { padding: 8px 12px; border-top: 1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,.02); }
  .mono { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; font-size: 12px; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge.single { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.orchestrated { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge.fallback { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge.no-match { background: rgba(248,81,73,.15); color: var(--red); }

  /* Trace tree */
  .layer { margin-left: 16px; padding: 4px 0; border-left: 2px solid var(--border); padding-left: 12px; }
  .layer-header { font-weight: 500; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .layer-name { color: var(--accent); }
  .layer-status { font-size: 11px; padding: 1px 6px; border-radius: 8px; }
  .layer-status.match { background: rgba(63,185,80,.15); color: var(--green); }
  .layer-status.no-match { background: rgba(248,81,73,.15); color: var(--red); }
  .layer-detail { font-size: 12px; color: var(--dim); margin-top: 2px; }

  /* Detail panel */
  .detail { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 14px; }
  .detail pre { white-space: pre-wrap; font-size: 12px; color: var(--dim); max-height: 400px; overflow-y: auto; }
  .detail .close { float: right; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; }
  .detail .close:hover { color: var(--text); }
  .detail h3 { font-size: 15px; margin-bottom: 10px; }
  .detail .meta { font-size: 12px; color: var(--dim); margin-bottom: 10px; }

  /* Conversation turns */
  .turn { padding: 10px 14px; border-left: 3px solid var(--border); margin: 8px 0; border-radius: 0 6px 6px 0; }
  .turn.user { border-color: var(--accent); }
  .turn.assistant { border-color: var(--purple); }
  .turn.tool { border-color: var(--dim); }
  .turn .role { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .turn .role.user { color: var(--accent); }
  .turn .role.assistant { color: var(--purple); }
  .turn .role.tool { color: var(--dim); }
  .turn .content { font-size: 13px; }

  /* Path-1 mirror blocks */
  .turn .thinking { margin: 4px 0 8px; }
  .turn .thinking summary { cursor: pointer; font-size: 11px; color: var(--dim); font-style: italic; }
  .turn .thinking .thinking-body { font-size: 12px; color: var(--dim); margin-top: 6px; padding: 6px 10px; background: rgba(255,255,255,0.02); border-radius: 4px; white-space: pre-wrap; }
  .turn .tool-calls { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .turn .tool-call-badge { font: 11px var(--mono); background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px; color: var(--dim); }
  .turn .tool-results { margin: 6px 0; }
  .turn .tool-result { font: 11px var(--mono); color: var(--dim); padding: 2px 0; }
  .turn .tool-result.error { color: #e66; }
  .turn .tool-result-preview { display: block; margin-top: 2px; padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 3px; white-space: pre-wrap; }
  .turn .meta-line { font-size: 11px; color: var(--dim); margin-top: 4px; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--dim); }
  .empty { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 14px; }

  /* Skill bar */
  .skill-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .skill-bar .name { width: 180px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skill-bar .bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .skill-bar .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .skill-bar .count { font-size: 12px; color: var(--dim); width: 40px; text-align: right; }

  /* Filter */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .filter-bar select, .filter-bar input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .filter-bar select { min-width: 140px; }

  .clickable { cursor: pointer; color: var(--accent); }
  .clickable:hover { text-decoration: underline; }

  /* Discoveries (M12 M4 — read-only) */
  .note { background: rgba(88,166,255,.08); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .note code { color: var(--accent); }
  .disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .disc-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .disc-card .pattern { font-size: 13px; margin-bottom: 8px; }
  .disc-card .examples { font-size: 12px; color: var(--dim); margin: 6px 0; }
  .disc-card .examples div { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .disc-card .meta-line2 { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .disc-card .cli-hint { font-size: 11px; color: var(--dim); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .badge.pending { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge.dismissed { background: rgba(248,81,73,.15); color: var(--red); }
  .badge.muted { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge.miss { background: rgba(163,113,247,.15); color: var(--purple); }
</style>
</head>
<body>
<header>
  <h1>⚡ VibeSOP Dashboard</h1>
  <span class="ver">v8.1</span>
  <nav>
    <button class="active" data-tab="overview">📊 Overview</button>
    <button data-tab="history">📋 History</button>
    <button data-tab="traces">🔍 Traces</button>
    <button data-tab="conversations">💬 Conversations</button>
    <button data-tab="discoveries">✨ Discoveries</button>
  </nav>
  <button class="refresh" onclick="refreshAll()">🔄 Refresh</button>
</header>

<main>
  <!-- Overview Tab -->
  <div id="tab-overview" class="tab active">
    <div class="cards" id="health-cards"></div>
    <div class="card" style="margin-bottom:14px">
      <h3 style="font-size:14px;margin-bottom:10px">🏆 Top Skills</h3>
      <div id="top-skills"></div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:10px">📈 Mode Distribution</h3>
      <div id="mode-dist"></div>
    </div>
  </div>

  <!-- History Tab -->
  <div id="tab-history" class="tab">
    <div class="filter-bar">
      <label style="font-size:13px;color:var(--dim)">Filter:</label>
      <select id="hist-filter" onchange="loadHistory()">
        <option value="">All Skills</option>
      </select>
      <span style="font-size:12px;color:var(--dim);margin-left:auto" id="hist-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Time</th><th>Query</th><th>Skill</th><th>Mode</th><th>Sat.</th><th>Duration</th>
        </tr></thead>
        <tbody id="hist-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Traces Tab -->
  <div id="tab-traces" class="tab">
    <div class="filter-bar">
      <label style="font-size:13px;color:var(--dim)">Source:</label>
      <select id="trace-source" onchange="loadTraces()">
        <option value="all">All (Routing + Agent)</option>
        <option value="routing">Routing Traces</option>
        <option value="agent">Agent Spans</option>
      </select>
      <label style="font-size:13px;color:var(--dim);margin-left:12px">Kind:</label>
      <select id="span-kind-filter" onchange="loadTraces()" style="display:none">
        <option value="">All Kinds</option>
        <option value="task">task</option>
        <option value="llm">llm</option>
        <option value="tool_call">tool_call</option>
        <option value="file_edit">file_edit</option>
        <option value="workflow_node">workflow_node</option>
      </select>
      <span style="font-size:12px;color:var(--dim);margin-left:auto" id="traces-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>Source</th><th>Kind</th><th>Name/Query</th><th>Status</th><th>Duration</th>
        </tr></thead>
        <tbody id="traces-body"></tbody>
      </table>
    </div>
    <div id="trace-detail" style="display:none" class="detail"></div>
  </div>

  <!-- Conversations Tab -->
  <div id="tab-conversations" class="tab">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>Turns</th><th>Preview</th><th>Updated</th>
        </tr></thead>
        <tbody id="conv-body"></tbody>
      </table>
    </div>
    <div id="conv-detail" style="display:none" class="detail"></div>
  </div>

  <!-- Discoveries Tab (M12 M4 — read-only) -->
  <div id="tab-discoveries" class="tab">
    <div class="note">🔒 只读视图 —— promote / dismiss / mute 均在 CLI 操作：<code>vibe skill discover</code>。看板展示全部状态（含 dismissed / muted，以徽章区分）；CLI 默认只显示 pending，<code>--all</code> 查看全部。</div>
    <div class="cards" id="disc-stats"></div>
    <div id="disc-list"></div>
  </div>
</main>

<script>
// ── Tab switching ──────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

// ── Data loading ───────────────────────────────────────────────
async function api(path) {
  const r = await fetch(path);
  return r.json();
}

function timeAgo(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return d.toLocaleDateString();
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let healthData = null;

async function loadTab(tab) {
  switch(tab) {
    case 'overview': loadOverview(); break;
    case 'history': loadHistory(); break;
    case 'traces': loadTraces(); break;
    case 'conversations': loadConversations(); break;
    case 'discoveries': loadDiscoveries(); break;
  }
}

async function refreshAll() {
  const active = document.querySelector('nav button.active');
  if (active) loadTab(active.dataset.tab);
}

// ── Overview ───────────────────────────────────────────────────
async function loadOverview() {
  healthData = await api('/api/health');

  const cards = document.getElementById('health-cards');
  const h = healthData;
  cards.innerHTML = `
    <div class="card">
      <div class="label">Total Routes</div>
      <div class="value accent">${h.total_routes}</div>
      <div class="sub">all-time routing calls</div>
    </div>
    <div class="card">
      <div class="label">Hit Rate</div>
      <div class="value ${h.hit_rate >= 50 ? 'green' : h.hit_rate >= 30 ? 'yellow' : 'red'}">${h.hit_rate}%</div>
      <div class="sub">skills matched vs fallback</div>
    </div>
    <div class="card">
      <div class="label">Avg Satisfaction</div>
      <div class="value ${h.avg_satisfaction >= 3 ? 'green' : h.avg_satisfaction >= 2 ? 'yellow' : 'red'}">${h.avg_satisfaction ?? '-'}</div>
      <div class="sub">out of 5</div>
    </div>
    <div class="card">
      <div class="label">P95 Latency</div>
      <div class="value ${h.latency_p95 < 200 ? 'green' : h.latency_p95 < 500 ? 'yellow' : 'red'}">${h.latency_p95}ms</div>
      <div class="sub">P50: ${h.latency_p50}ms / P99: ${h.latency_p99}ms</div>
    </div>
    <div class="card">
      <div class="label">Traces</div>
      <div class="value accent">${h.total_traces}</div>
      <div class="sub">routing decision trees</div>
    </div>
    <div class="card">
      <div class="label">Agent Spans</div>
      <div class="value accent">${h.total_spans}</div>
      <div class="sub">LLM/tool/task calls</div>
    </div>
    <div class="card">
      <div class="label">Conversations</div>
      <div class="value accent">${h.total_conversations}</div>
      <div class="sub">multi-turn sessions</div>
    </div>
  `;

  // Top skills
  const ts = document.getElementById('top-skills');
  if (h.top_skills && h.top_skills.length) {
    const max = h.top_skills[0][1];
    ts.innerHTML = h.top_skills.map(([name, count]) => `
      <div class="skill-bar">
        <span class="name">${escapeHtml(name)}</span>
        <span class="bar"><span class="fill" style="width:${(count/max*100).toFixed(0)}%"></span></span>
        <span class="count">${count}</span>
      </div>
    `).join('');
  } else {
    ts.innerHTML = '<div class="empty">No skill data yet</div>';
  }

  // Mode distribution
  const md = document.getElementById('mode-dist');
  const modes = h.mode_distribution || {};
  const modeLabels = { single: 'Single Match', orchestrated: 'Orchestrated', 'no-match': 'No Match', fallback: 'Fallback LLM' };
  md.innerHTML = Object.entries(modes).map(([k, v]) => `
    <span class="badge ${k}">${modeLabels[k] || k}: ${v}</span>
  `).join(' ') || '<span class="dim">No data</span>';
}

// ── History ────────────────────────────────────────────────────
let allHistory = [];

async function loadHistory() {
  const skill = document.getElementById('hist-filter').value;
  const data = await api('/api/analytics?limit=200' + (skill ? '&skill=' + encodeURIComponent(skill) : ''));
  allHistory = data;

  // Update filter options
  const skills = [...new Set(data.map(r => r.primary_skill || r.skill_id).filter(Boolean))].sort();
  const sel = document.getElementById('hist-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Skills</option>' + skills.map(s => `<option value="${escapeHtml(s)}" ${s===cur?'selected':''}>${escapeHtml(s)}</option>`).join('');

  const tbody = document.getElementById('hist-body');
  document.getElementById('hist-count').textContent = data.length + ' records';

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No routing history found. Run <code>vibe route "your query"</code> to generate data.</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(r => `
    <tr>
      <td>${timeAgo(r.timestamp)}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(r.query || '')}">${escapeHtml((r.query || '').substring(0, 60))}</td>
      <td><span class="mono">${escapeHtml(r.primary_skill || r.skill_id || '-')}</span></td>
      <td><span class="badge ${r.mode || 'unknown'}">${r.mode || 'unknown'}</span></td>
      <td>${r.user_satisfaction ? '⭐'.repeat(r.user_satisfaction) : '-'}</td>
      <td>${r.duration_ms ? r.duration_ms + 'ms' : '-'}</td>
    </tr>
  `).join('');
}

// ── Traces ─────────────────────────────────────────────────────
async function loadTraces() {
  const source = document.getElementById('trace-source').value;
  const kind = document.getElementById('span-kind-filter').value;
  const kindFilter = document.getElementById('span-kind-filter');

  // Show/hide kind filter based on source
  kindFilter.style.display = (source === 'all' || source === 'agent') ? 'inline-block' : 'none';

  let url = '/api/traces?limit=100&source=' + source;
  const data = await api(url);
  const tbody = document.getElementById('traces-body');

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No traces found. Start using VibeSOP to generate routing traces and agent spans.</td></tr>';
    document.getElementById('traces-count').textContent = '0 items';
    return;
  }

  // Filter by kind if selected (for agent spans)
  let filtered = data;
  if (kind && (source === 'all' || source === 'agent')) {
    filtered = data.filter(t => t.span_kind === kind || t._source === 'routing');
  }

  document.getElementById('traces-count').textContent = filtered.length + ' items';

  tbody.innerHTML = filtered.map(t => {
    const isAgent = t._source === 'agent';
    const isRouting = t._source === 'routing';
    const kind = t.span_kind || '-';
    const name = isAgent ? (t.name || '').substring(0, 50) : (t.query || '').substring(0, 50);
    const status = t.status || (t.result ? 'ok' : '-');
    const duration = t.duration_ms ? t.duration_ms + 'ms' : '-';
    const id = (t._id || '').substring(0, 12);
    const source = isAgent ? 'agent' : 'routing';

    return '<tr data-trace-id="' + escapeHtml(t._id || '') + '" data-trace-source="' + source + '">' +
      '<td><span class="mono clickable">' + escapeHtml(id) + '...</span></td>' +
      '<td><span class="badge ' + (isAgent ? 'orchestrated' : 'single') + '">' + (isAgent ? '🤖 Agent' : '🧭 Route') + '</span></td>' +
      '<td><span class="mono">' + escapeHtml(kind) + '</span></td>' +
      '<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</td>' +
      '<td><span class="badge ' + (status === 'ok' ? 'single' : status === 'error' ? 'no-match' : '') + '">' + escapeHtml(status) + '</span></td>' +
      '<td>' + duration + '</td>' +
      '</tr>';
  }).join('');

  // Delegated click handler for trace rows (avoids XSS via inline onclick)
  document.getElementById('traces-body').onclick = function(e) {
    const row = e.target.closest('tr[data-trace-id]');
    if (row) {
      showTraceDetail(row.dataset.traceId, row.dataset.traceSource);
    }
  };
}

async function showTraceDetail(id, source) {
  let t;
  if (source === 'agent') {
    t = await api('/api/spans/' + id);
  } else {
    t = await api('/api/traces/' + id);
  }

  const div = document.getElementById('trace-detail');
  div.style.display = 'block';

  if (source === 'agent') {
    // Agent span detail
    const parent = t.parent_span_id ? '<div style="font-size:12px;color:var(--dim)">Parent: ' + escapeHtml(t.parent_span_id.substring(0, 12)) + '...</div>' : '';
    const meta = t.metadata || {};
    const metaStr = typeof meta === 'string' ? meta : JSON.stringify(meta, null, 2);
    div.innerHTML = '<button class="close" onclick="this.parentElement.style.display=\'none\'">&times;</button>' +
      '<h3>🤖 Agent Span: ' + escapeHtml(t.name || '') + '</h3>' +
      '<div class="meta">' +
        'Kind: <strong>' + escapeHtml(t.span_kind || '-') + '</strong> &bull; ' +
        'Status: <strong>' + escapeHtml(t.status || '-') + '</strong> &bull; ' +
        'Duration: ' + (t.duration_ms || '-') + 'ms &bull; ' +
        'Tokens: in=' + (t.tokens_input || 0) + ' out=' + (t.tokens_output || 0) +
      '</div>' +
      parent +
      '<div style="margin-top:8px"><strong>Trace ID:</strong> <span class="mono">' + escapeHtml(t.trace_id || '') + '</span></div>' +
      '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">Metadata</summary><pre>' + escapeHtml(metaStr) + '</pre></details>' +
      '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">Raw JSON</summary><pre>' + escapeHtml(JSON.stringify(t, null, 2)) + '</pre></details>';
  } else {
    // Routing trace detail (existing logic)
    const layers = t.layer_details || t.layers || [];
    div.innerHTML = '<button class="close" onclick="this.parentElement.style.display=\'none\'">&times;</button>' +
      '<h3>🧭 Trace: ' + escapeHtml(id) + '</h3>' +
      '<div class="meta">Query: <strong>' + escapeHtml(t.query || '') + '</strong> &bull; Duration: ' + (t.duration_ms || '?') + 'ms &bull; Result: ' + escapeHtml(t.primary_skill || t.result || 'none') + '</div>' +
      '<h4 style="font-size:13px;margin-bottom:8px;color:var(--dim)">Decision Tree</h4>' +
      (layers.map(function(l) {
        return '<div class="layer">' +
          '<div class="layer-header">' +
            '<span class="layer-name">' + escapeHtml(l.layer || l.name || '?') + '</span>' +
            '<span class="layer-status ' + (l.matched || l.match ? 'match' : 'no-match') + '">' + (l.matched || l.match ? '✓ MATCH' : '✗ NO MATCH') + '</span>' +
            (l.confidence ? '<span style="font-size:11px;color:var(--dim)">' + (l.confidence*100).toFixed(0) + '%</span>' : '') +
            (l.duration_ms ? '<span style="font-size:11px;color:var(--dim)">' + l.duration_ms + 'ms</span>' : '') +
          '</div>' +
          (l.reason || l.detail ? '<div class="layer-detail">' + escapeHtml((l.reason || l.detail || '').substring(0, 200)) + '</div>' : '') +
        '</div>';
      }).join('') || '<div class="empty">No layer data</div>') +
      '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">Raw JSON</summary><pre>' + escapeHtml(JSON.stringify(t, null, 2)) + '</pre></details>';
  }
  div.scrollIntoView({ behavior: 'smooth' });
}

// Remove old showTrace function (replaced by showTraceDetail)
function showTrace(id) { showTraceDetail(id, 'routing'); }

// ── Conversations ──────────────────────────────────────────────
async function loadConversations() {
  const data = await api('/api/conversations?limit=30');
  const tbody = document.getElementById('conv-body');

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">No conversations found. Multi-turn conversations are created automatically during routing.</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(c => {
    // Sub-agent mirror conversations carry metadata.agent_type / description.
    // Surface them as a badge + alt preview so the dashboard list distinguishes
    // "Explore — Map companion server" from the parent session at a glance.
    const meta = c.metadata || {};
    const isSub = meta.is_subagent;
    const typeBadge = meta.agent_type
      ? `<span class="tool-call-badge" style="margin-right:6px">${escapeHtml(meta.agent_type)}</span>`
      : '';
    // Privacy/safety: every text interpolation into innerHTML must pass
    // escapeHtml. Previously c.preview was raw in the fallback path — that
    // XSS'd any user-prompt containing HTML (found by grok review).
    const desc = meta.description
      ? escapeHtml(meta.description)
      : escapeHtml(c.preview || '');
    const idPrefix = isSub ? '↳ ' : '';
    return `
    <tr data-conv-id="${escapeHtml(c._id)}">
      <td><span class="mono clickable">${idPrefix}${escapeHtml(c._id.substring(0, 20))}…</span></td>
      <td>${typeBadge}${c.turn_count || '-'}</td>
      <td style="max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${desc}</td>
      <td>${timeAgo(c.updated_at || c.timestamp)}</td>
    </tr>`;
  }).join('');
  // Wire up clicks via data-conv-id rather than inline onclick — escapes-free
  // dispatch prevents _id (now carrying agentType) from breaking out of the
  // JS string context. Found by grok review (issue 7).
  document.querySelectorAll('tr[data-conv-id]').forEach(tr => {
    tr.addEventListener('click', () => showConversation(tr.dataset.convId));
  });
}

function renderThinking(thinking) {
  if (!thinking) return '';
  // Collapsed by default — thinking is verbose, user opts in to expand.
  const preview = thinking.slice(0, 80);
  return `
    <details class="thinking">
      <summary>💭 thinking (${thinking.length} chars): ${escapeHtml(preview)}${thinking.length > 80 ? '…' : ''}</summary>
      <div class="thinking-body">${escapeHtml(thinking)}</div>
    </details>`;
}

function renderToolCalls(toolCalls) {
  if (!toolCalls || !toolCalls.length) return '';
  // Privacy invariant: input_keys only — values never persisted.
  const badges = toolCalls.map(tc => {
    const keys = (tc.input_keys || []).join(', ');
    return `<span class="tool-call-badge">🔧 ${escapeHtml(tc.name || '?')}(${escapeHtml(keys)})</span>`;
  }).join('');
  return `<div class="tool-calls">${badges}</div>`;
}

function renderToolResults(toolResults) {
  if (!toolResults || !toolResults.length) return '';
  const items = toolResults.map(tr => {
    const errCls = tr.is_error ? ' error' : '';
    const icon = tr.is_error ? '✗' : '✓';
    let preview = '';
    if (tr.content_preview) {
      preview = `<span class="tool-result-preview">${escapeHtml(tr.content_preview)}</span>`;
    }
    return `<div class="tool-result${errCls}">${icon} ${escapeHtml(tr.tool_use_id || '?')}${preview}</div>`;
  }).join('');
  return `<div class="tool-results">${items}</div>`;
}

function renderMetaLine(t) {
  // Compact "model · N tokens · stop_reason" line — dim so it doesn't dominate.
  const parts = [];
  if (t.model) parts.push(t.model);
  if (t.usage) {
    const u = t.usage;
    const total = (u.input_tokens || 0) + (u.output_tokens || 0);
    if (total > 0) {
      const cache = (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
      parts.push(`${total} tok${cache > 0 ? ` (${cache} cached)` : ''}`);
    }
  }
  if (t.stop_reason) parts.push(`stop: ${t.stop_reason}`);
  if (!parts.length) return '';
  return `<div class="meta-line">${escapeHtml(parts.join(' · '))}</div>`;
}

function renderConversationBanner(c) {
  // Sub-agent conversations carry metadata about their role in the parent
  // workflow. Show a compact banner so the dashboard reader immediately
  // sees "this is an Explore sub-agent of session X" without scrolling.
  const meta = c.metadata;
  if (!meta || !meta.is_subagent) return '';
  const parts = [];
  if (meta.agent_type) parts.push(`<span class="tool-call-badge">${escapeHtml(meta.agent_type)}</span>`);
  if (meta.description) parts.push(`<span style="color:var(--dim)">${escapeHtml(meta.description)}</span>`);
  if (meta.parent_session) parts.push(`<span style="color:var(--dim);font-size:11px">parent: ${escapeHtml(String(meta.parent_session).substring(0, 16))}…</span>`);
  if (!parts.length) return '';
  return `<div class="meta" style="margin-bottom:10px;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:4px">↳ sub-agent · ${parts.join(' · ')}</div>`;
}

function renderTurn(t) {
  const role = t.role || 'user';
  // Render order (per design review): thinking → tool_calls → text → tool_results.
  // Assistant loop narrative: "agent thought X, called tools, wrote text Y,
  // observed results Z." User turns carry tool_results (Claude Code convention).
  const content = escapeHtml(t.query || t.content || '');
  const thinking = role === 'assistant' ? renderThinking(t.thinking) : '';
  const toolCalls = role === 'assistant' ? renderToolCalls(t.tool_calls) : '';
  const toolResults = role === 'user' ? renderToolResults(t.tool_results) : '';
  const meta = role === 'assistant' ? renderMetaLine(t) : '';
  // Tool-result-only user turn (Claude Code convention): no human text, just
  // results from the prior assistant's tool calls. Without this subtitle the
  // card reads as "user said nothing" — found by grok+pi review.
  const isToolResultOnlyUser = role === 'user' && !content && toolResults;
  const toolResultLabel = isToolResultOnlyUser
    ? '<div class="meta-line" style="font-style:italic">← results from prior tool calls</div>'
    : '';
  return `
    <div class="turn ${role}">
      <div class="role ${role}">${role}</div>
      ${thinking}
      ${toolCalls}
      ${content ? `<div class="content">${content}</div>` : ''}
      ${toolResultLabel}
      ${toolResults}
      ${meta}
    </div>`;
}

async function showConversation(id) {
  const c = await api('/api/conversations/' + id);
  const div = document.getElementById('conv-detail');
  const turns = c.turns || [];

  div.style.display = 'block';
  div.innerHTML = `
    <button class="close" onclick="this.parentElement.style.display='none'">&times;</button>
    <h3>Conversation: ${escapeHtml(id)}</h3>
    <div class="meta">${turns.length} turns &bull; Current skill: ${escapeHtml(c.current_skill || c.previous_skill || 'none')}</div>
    ${renderConversationBanner(c)}
    ${turns.map(renderTurn).join('')}
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">Raw JSON</summary><pre>${escapeHtml(JSON.stringify(c, null, 2))}</pre></details>
  `;
  div.scrollIntoView({ behavior: 'smooth' });
}

// ── Discoveries (M12 M4 — read-only) ───────────────────────────
async function loadDiscoveries() {
  const data = await api('/api/discoveries');
  const stats = data.stats || {};
  const byStatus = stats.by_status || {};
  const echoCount = stats.agent_echo ?? 0;
  // gate35 D3: per-source 只读 outcome 计数（口径见 discovery.source_outcome_stats）
  const outcomes = stats.by_source_outcome || {};
  const outcomeText = Object.keys(outcomes).sort().map(src => {
    const o = outcomes[src] || {};
    const label = src === 'miss_recurrence' ? 'miss×复现' : src;
    return label + ' 成功 ' + (o.success ?? 0) + ' · 否决 ' + (o.dismiss ?? 0) +
      (o.shape_batch ? '（shape-batch ' + o.shape_batch + '）' : '');
  }).join(' · ');

  document.getElementById('disc-stats').innerHTML = `
    <div class="card">
      <div class="label">Candidates</div>
      <div class="value accent">${stats.total ?? 0}</div>
      <div class="sub">project + global scopes</div>
    </div>
    <div class="card">
      <div class="label">Pending</div>
      <div class="value green">${byStatus.pending ?? 0}</div>
      <div class="sub">awaiting CLI review</div>
    </div>
    <div class="card">
      <div class="label">Dismissed / Muted</div>
      <div class="value ${(byStatus.dismissed || byStatus.muted) ? 'yellow' : ''}">${(byStatus.dismissed ?? 0) + (byStatus.muted ?? 0)}</div>
      <div class="sub">negative list / 静音中</div>
    </div>
    <div class="card">
      <div class="label">Cooling</div>
      <div class="value">${stats.cooling ?? 0}</div>
      <div class="sub">14 天无新增成员</div>
    </div>
    <div class="card" title="shape: agent-echo — 前缀谓词命中的机器形状回声，展示层沉底；批量否决: vibe skill discover dismiss --shape agent-echo">
      <div class="label">机器形状</div>
      <div class="value ${echoCount ? 'yellow' : ''}">${echoCount}</div>
      <div class="sub">agent-echo · 已沉底</div>
    </div>
    ${outcomeText ? `<div class="card"><div class="label">来源统计（只读）</div><div class="sub" style="font-size:12px">${escapeHtml(outcomeText)}</div><div class="sub">成功=提升后路由命中≥5 · 否决=池翻转(不含 shape-batch)</div></div>` : ''}
  `;

  const list = document.getElementById('disc-list');
  const cards = data.discoveries || [];
  const verdictsHtml = renderVerdicts(data.verdicts || {});
  if (!cards.length) {
    list.innerHTML = '<div class="empty">Discovery 队列暂无候选。正常使用 vibe 并定期运行 <code>vibe skill scan-candidates</code> 后，复现模式会汇聚到这里。</div>' + verdictsHtml;
    return;
  }

  list.innerHTML = '<div class="disc-grid">' + cards.map(c => {
    const ev = c.evidence || {};
    const xpBadge = c.is_cross_project ? '<span class="badge miss">[XP]</span>' : '';
    const scopeBadge = '<span class="badge ' + (c.scope === 'global' ? 'orchestrated' : 'single') + '">' + escapeHtml(c.scope) + '</span>';
    let statusBadge = '<span class="badge pending">pending</span>';
    if (c.status === 'dismissed') statusBadge = '<span class="badge dismissed">dismissed</span>';
    else if (c.status === 'muted') statusBadge = '<span class="badge muted">muted' + (c.mute_expires_at ? ' → ' + escapeHtml(c.mute_expires_at.substring(0, 10)) : '') + '</span>';
    const sourceBadge = c.source === 'miss_recurrence'
      ? '<span class="badge miss">miss×复现</span>'
      : '<span class="badge single">gold ' + Math.round((ev.gold_rate || 0) * 100) + '%</span>';
    const echoBadge = c.agent_echo
      ? '<span class="badge muted" title="机器形状回声（前缀谓词命中），已沉底；批量否决: vibe skill discover dismiss --shape agent-echo">shape: agent-echo</span>'
      : '';
    const examples = (c.example_queries || []).map(q =>
      '<div>• ' + escapeHtml(q) + '</div>').join('');
    const steps = (c.top_steps || []).map(s =>
      '<span class="tool-call-badge">' + escapeHtml(s.name) + ' · ' + escapeHtml(s.label) + '</span>').join(' ');
    const projects = Object.entries(c.project_distribution || {}).map(([k, v]) => escapeHtml(k) + '×' + v).join(', ');
    return '<div class="card disc-card">' +
      '<div class="head">' + xpBadge +
        '<span class="mono clickable" title="' + escapeHtml(c.cluster_id) + '">' + escapeHtml(c.cluster_id_short) + '</span>' +
        scopeBadge + statusBadge + sourceBadge + echoBadge +
        '<span style="margin-left:auto;font-size:12px;color:var(--dim)">score ' + c.score + '</span>' +
      '</div>' +
      '<div class="pattern">' + escapeHtml(c.pattern_summary || '(no query)') + '</div>' +
      (examples ? '<div class="examples">' + examples + '</div>' : '') +
      '<div class="meta-line2" title="为什么在这里 —— 只从候选实存字段直译（修订 F）">为什么在: ' + escapeHtml(c.why_here || '') + '</div>' +
      '<div class="meta-line2">证据: ' + (ev.span_count ?? 0) + ' spans · ' + (ev.distinct_task_keys ?? 0) + ' tasks' +
        ' · 行为: ' + escapeHtml(c.behavior_evidence || 'not_collected') +
        ' · 首见: ' + c.age_days + 'd' + (c.cooling ? ' (冷却中)' : '') + '</div>' +
      (steps ? '<div class="meta-line2">' + steps + '</div>' : '') +
      (projects ? '<div class="meta-line2">项目: ' + projects + '</div>' : '') +
      '<div class="cli-hint">' + escapeHtml(c.cli_hint) + '</div>' +
    '</div>';
  }).join('') + '</div>' + verdictsHtml;
}

// gate36 阶段二 — promote shadow verdicts (修订 D; 与 CLI `_print_verdict`
// 口径 lockstep: 徽章两级 PASS/WARN · 无 FAIL · 永不阻断 · 文案写明测的是
// 触发召回不是内容质量; 卡片只在与当前 draft 字节哈希匹配时不标 stale)。
function renderVerdicts(verdicts) {
  const clusterIds = Object.keys(verdicts);
  if (!clusterIds.length) return '';
  const cards = clusterIds.sort().map(cid => {
    // Display the newest entry; prefer a non-degraded (complete) one —
    // same rule as the CLI's latest_for_cluster(prefer_complete=True).
    const entries = verdicts[cid] || [];
    const v = entries.find(e => !e.degraded) || entries[0];
    if (!v) return '';
    const badge = '<span class="badge ' + (v.badge === 'PASS' ? 'single' : 'miss') + '">Verifier: ' + escapeHtml(v.badge) + '</span>';
    const degradedBadge = v.degraded ? '<span class="badge muted">degraded: embedding 线不可用</span>' : '';
    // pi-4/claude-3 收敛: skipped (无 triggers 可嵌) 单独措辞, 不打降级文案
    // —— 与 CLI `_print_verdict` 的 "线跳过 (skipped ≠ 降级)" lockstep。
    const es = v.embedding_status || {};
    const skippedBadge = (es.recall === 'skipped' || es.index === 'skipped')
      ? '<span class="badge muted" title="' + (es.index === 'skipped' ? 'index' : 'recall') + ' 线: 无 declared triggers 可嵌">线跳过 (skipped ≠ 降级)</span>'
      : '';
    const staleBadge = v.stale ? '<span class="badge dismissed" title="verdict 的 draft 字节哈希与当前文件不一致（draft 在 verdict 之后被编辑或缺失）— activate 时会自动重跑">stale</span>' : '';
    const scopeBadge = '<span class="badge ' + (v.scope === 'global' ? 'orchestrated' : 'single') + '">' + escapeHtml(v.scope) + '</span>';
    const sh = v.shadow || {};
    const summary = 'shadow: 捕获 ' + (sh.caught ?? 0) + '/' + (sh.denominator ?? 0) +
      ' · 回声行 ' + (sh.echo_excluded ?? 0) + ' 条不进分母' +
      (v.hijack_count ? ' · hijack 风险 ' + v.hijack_count + ' 条' : '');
    // 修订 D: global verdict 只给计数/徽章, 不给 query 明细。
    // (明细文本已在服务端过 redact_sensitive —— 读侧脱敏, claude-5 收敛。)
    let detail = '';
    if (v.detail) {
      // pi-3 收敛: store 存全量 sha256, 展示层短显截断 (与 CLI 同取 16 位)。
      const missed = (v.detail.missed || []).map(m =>
        '<div>• ' + escapeHtml(m.query || ('query_hash:' + String(m.query_hash || '?').substring(0, 16))) +
        ' → 最近邻: ' + escapeHtml(m.nearest_trigger || '(无共享 token 的近邻)') + '</div>').join('');
      const warns = (v.detail.warnings || []).map(w => '<div>lint: ' + escapeHtml(w) + '</div>').join('');
      const hijacks = (v.detail.hijack || []).map(h =>
        '<div>• 与 ' + escapeHtml(h.competing_skill_id || '') + ' 的 trigger 「' +
        escapeHtml(h.competing_trigger || '') + '」 竞争</div>').join('');
      const body = (missed ? '<div class="meta-line2">未捕获 query（最近邻 trigger）:</div>' + missed : '') +
        (hijacks ? '<div class="meta-line2">hijack 风险:</div>' + hijacks : '') + warns;
      detail = body ? '<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">明细</summary>' + body + '</details>' : '';
    }
    return '<div class="card disc-card">' +
      '<div class="head">' + badge + degradedBadge + skippedBadge + staleBadge + scopeBadge +
        '<span class="mono" title="' + escapeHtml(cid) + '">' + escapeHtml(v.cluster_id_short || cid.substring(0, 8)) + '</span>' +
        '<span style="margin-left:auto;font-size:12px;color:var(--dim)">' + escapeHtml(v.phase || '') + ' · ' + escapeHtml((v.created_at || '').substring(0, 10)) + '</span>' +
      '</div>' +
      '<div class="meta-line2">' + escapeHtml(v.skill_id || '') + '</div>' +
      '<div class="meta-line2">' + escapeHtml(summary) + '</div>' +
      '<div class="meta-line2" style="color:var(--dim)">口径: 测的是触发召回 (trigger recall), 不是内容质量; shadow-only, 永不阻断</div>' +
      detail +
    '</div>';
  }).join('');
  return '<h3 style="margin-top:18px">Promote Verdicts <span style="font-size:12px;color:var(--dim)">(shadow · 不阻断 · 测触发召回非内容质量)</span></h3>' +
    '<div class="disc-grid">' + cards + '</div>';
}

// ── Init ───────────────────────────────────────────────────────
loadOverview();
</script>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required so release.yml can reuse this workflow as its ci-gate job
  # (uses: ./.github/workflows/ci.yml). Without it every release run
  # failed instantly with "workflow is not reusable".
  workflow_call:

env:
  UV_VERSION: "0.11.19"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run basedpyright
        # basedpyright exits 3 for warnings-only (no errors); the project
        # intentionally sets several rules to "warning" (advisory, non-blocking).
        # Accept exit 0 (clean) or 3 (warnings only); fail on 1 (errors).
        run: uv run basedpyright || [ $? -eq 3 ]

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    permissions:
      contents: read
      id-token: write  # codecov-action v4 tokenless (OIDC) upload
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        # Exclude benchmark/slow (load-sensitive, flaky under CI's full-suite
        # pressure) — matches the Makefile's `test` target filter.
        run: uv run pytest -m "not benchmark and not slow" --cov=src/vibesop --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=73

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-windows:
    name: Test Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    # Observation period: the Windows gate is non-blocking (continue-on-error)
    # for the first two weeks after landing (added 2026-07-19, P4 windows-compat
    # batch). Once it has stayed green for two weeks, remove continue-on-error
    # to make it a required gate. No coverage gate / codecov here — coverage
    # stays the ubuntu `test` job's responsibility.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # Same marker filter as the ubuntu job. --reruns 2 absorbs Windows
        # flakes (Defender scans, transient file-lock races).
        run: uv run pytest -q -m "not benchmark and not slow" --reruns 2

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pip-audit
        run: uv pip install "pip-audit>=2.9,<3"

      - name: Run pip-audit (venv)
        run: uv run pip-audit

      # Also audit the FULL locked dependency set (incl. the semantic extra —
      # torch/transformers are the project's largest supply-chain surface and
      # are never installed in this job's venv). Export resolves from uv.lock
      # without installing anything.
      - name: Run pip-audit (full lockfile, all extras)
        run: |
          uv export --all-extras --no-hashes --format requirements-txt --output-file /tmp/vibesop-all-deps.txt
          grep -v '^-e ' /tmp/vibesop-all-deps.txt > /tmp/vibesop-all-deps-clean.txt
          uv run pip-audit -r /tmp/vibesop-all-deps-clean.txt

      # Bandit catches first-order RCE / injection primitives in the
      # project's own code that pip-audit (which only scans dependency
      # CVEs) cannot see. Added in v7.0.9 per S29 red-team recommendation.
      # The S29 red-team pass found ext:: git URLs, tarfile.extractall
      # without filter, urllib without size limits, and local shell=True —
      # all of which Bandit would have flagged at PR time.
      - name: Install Bandit
        run: uv pip install bandit[toml]

      - name: Run Bandit
        # Skips (B324/B701/B608) are registered with justifications in
        # pyproject.toml [tool.bandit."skips"] — single source of truth.
        run: uv run bandit -c pyproject.toml -r src/vibesop -ll

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run routing benchmarks
        run: uv run pytest -m benchmark -v

  routing-eval:
    name: Routing Eval (report-only)
    runs-on: ubuntu-latest
    # PERMANENTLY report-only (gate38): continue-on-error stays forever —
    # there is NO observation period after which this job becomes a hard
    # gate (contrast the test-windows observation-period note above). The
    # harness itself always exits 0 and its absolute numbers are
    # environment-sensitive (local skill index, installed packs), so this
    # job exists to surface the JSON metrics for humans, never to block
    # merges. Do not "graduate" it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run main routing eval
        run: uv run python scripts/eval_routing.py --json --json-out eval-main.json

      - name: Run extended routing eval
        run: uv run python scripts/eval_routing.py --file tests/benchmark/routing_eval_extended.yaml --json --json-out eval-extended.json

      - name: Write step summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json

          print("### Routing Eval (report-only)\n")
          print("| dataset | scored | top-1 | recall@3 | skipped_env | errors |")
          print("|---|---|---|---|---|---|")
          for name, path in [("main", "eval-main.json"), ("extended", "eval-extended.json")]:
              m = json.load(open(path))
              print(
                  f"| {name} | {m['total']} | {m['top1_accuracy']:.1%} "
                  f"| {m['recall_at_3']:.1%} | {m['skipped_env']} | {len(m['errors'])} |"
              )
          EOF

      - name: Upload eval JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: routing-eval
          path: |
            eval-main.json
            eval-extended.json

# Quickstart e2e — the adoption cold-start gate (gate46 block 2, W3).
#
# Simulates the freshest possible user on Linux + Windows: build the wheel,
# install it with uv tool (no dev checkout, no HF model cache), then run
# `vibe quickstart --force` and assert the keyless demo lands — routing pair
# + real injection preview — with zero network and zero prompts.
#
# Dual-review hardening: HOME is redirected to a scratch dir (--force always
# installs globally into Path.home()), the demo assertions pin the skill id
# (not just any [ACTIVE SKILL:]), and both platform lanes deploy + verify
# their hook registration (claude-code shell script / grok JSON hook).
name: Quickstart E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.11.19"
  # Prove the demo has no embedding dependency: fresh machines have no
  # MiniLM cache, and the demo queries must hit KEYWORD/SCENARIO offline.
  HF_HUB_OFFLINE: "1"

jobs:
  quickstart-e2e:
    name: Quickstart E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel
        run: uv build

      # grok F3 (pull-20260828): the install used to run under the runner's
      # real HOME — mutating it, and leaving the deployed .sh unable to find
      # its uv-tool python under the scratch home (the smoke had to bypass
      # the script via `vibe` on PATH). Installing under the scratch home
      # makes the deployed artifact genuinely executable.
      - name: Install wheel as a tool (fresh-user layout, scratch home)
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
        run: |
          mkdir -p "$HOME"
          uv tool install --no-cache --force ./dist/vibesop-*.whl
          uv tool list
          # Later steps resolve `vibe` from the scratch-home shim.
          uv tool dir --bin >> "$GITHUB_PATH"

      # --force installs into Path.home() regardless of cwd — isolate it so
      # the job never mutates the runner's real home (self-hosted safe).
      - name: Quickstart --force (claude-code lane)
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
          VIBE_E2E_OUTPUT: ${{ runner.temp }}/quickstart-claude.txt
        run: |
          mkdir -p "$HOME"
          set -o pipefail
          vibe quickstart --force < /dev/null 2>&1 | tee "$VIBE_E2E_OUTPUT"

      - name: Quickstart --force (grok-build lane)
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
          VIBE_E2E_OUTPUT: ${{ runner.temp }}/quickstart-grok.txt
        run: |
          set -o pipefail
          vibe quickstart --force --platform grok-build < /dev/null 2>&1 | tee "$VIBE_E2E_OUTPUT"

      - name: Assert keyless demo landed (route pair + injection preview)
        env:
          CLAUDE_OUT: ${{ runner.temp }}/quickstart-claude.txt
          GROK_OUT: ${{ runner.temp }}/quickstart-grok.txt
        run: |
          fail=0
          check() { # file label pattern
            if grep -qF "$3" "$1"; then echo "  ok: $2"; else
              echo "  MISSING: $2 (pattern: $3) in $1"; fail=1; fi
          }
          echo "Asserting quickstart demo markers (claude lane):"
          check "$CLAUDE_OUT" "same skill, both languages" "same skill, both languages"
          check "$CLAUDE_OUT" "injection preview header"   "Injection preview"
          check "$CLAUDE_OUT" "pinned skill marker"        "[ACTIVE SKILL: builtin/commit-message]"
          check "$CLAUDE_OUT" "preview reaches skill body" "# Commit Message"
          echo "Asserting quickstart demo markers (grok lane):"
          check "$GROK_OUT" "same skill, both languages" "same skill, both languages"
          check "$GROK_OUT" "pinned skill marker"        "[ACTIVE SKILL: builtin/commit-message]"
          for f in "$CLAUDE_OUT" "$GROK_OUT"; do
            if grep -qF "preview unavailable" "$f"; then
              echo "  FAIL: preview degraded in $f"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "--- quickstart output tails ---"
            tail -40 "$CLAUDE_OUT"; tail -40 "$GROK_OUT"
            exit 1
          fi
          echo "QUICKSTART E2E PASSED"

      - name: Assert hook registration on both platforms
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
        run: |
          fail=0
          # claude-code: shell hook script deployed under ~/.claude
          claude_hook="$HOME/.claude/hooks/vibesop-route.sh"
          if [ -f "$claude_hook" ]; then echo "  ok: claude-code hook script ($claude_hook)"
          else echo "  MISSING: $claude_hook"; fail=1; fi
          # grok-build: JSON hook config referencing `vibe route --hook`
          grok_hook_found=0
          for cand in "$HOME/.grok/hooks/"*.json "$HOME/.grok/"*.json; do
            [ -f "$cand" ] || continue
            if grep -qF "vibe route --hook" "$cand"; then
              echo "  ok: grok-build JSON hook ($cand)"; grok_hook_found=1; break
            fi
          done
          [ "$grok_hook_found" -eq 1 ] || { echo "  MISSING: grok JSON hook referencing 'vibe route --hook'"; fail=1; }
          if grep -qF "vibe route --hook --platform grok-build" "$HOME/.grok/hooks/"*.json 2>/dev/null \
             || grep -qF "vibe route --hook --platform grok-build" "$HOME/.grok/"*.json 2>/dev/null; then
            echo "  ok: grok JSON command includes --platform grok-build"
          else
            echo "  MISSING: grok JSON command --platform grok-build"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Claude host-shaped hook smoke
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
        run: |
          script="$HOME/.claude/hooks/vibesop-route.sh"
          test -f "$script"
          # Pin the generated command shape: bash <posix-abs-path> on both
          # platforms. Config-relative hooks/<name>.sh and quoted POSIX are
          # both live failure modes (2.1.220 CWD resolution / pre-2.1 join).
          if grep -qE '"command": "bash [^"]+vibesop-route\.sh"' "$HOME/.claude/settings.json"; then
            echo "ok: settings.json hook command shape"
          else
            echo "BAD command in settings.json:"
            grep '"command"' "$HOME/.claude/settings.json" || true
            exit 1
          fi
          # The tool now lives under the scratch home (install-time HOME
          # redirect above), so the deployed script finds its uv-tool
          # python — execute the artifact itself, not a PATH-side bypass,
          # with no || true masking the exit code. Files live in $PWD
          # (working-directory is runner.temp) — do not use RUNNER_TEMP,
          # whose Windows value contains `\t` (tab-expanded in bash
          # double quotes).
          payload="$PWD/claude-hook-in.json"
          out="$PWD/claude-hook-out.txt"
          printf '%s\n' '{"prompt":"help me write a commit message","session_id":"e2e-claude"}' > "$payload"
          bash "$script" < "$payload" > "$out"
          echo "----- deployed script stdout -----"
          cat "$out"
          grep -qF "[ACTIVE SKILL: builtin/commit-message]" "$out"

      # M1 class: a home containing a space (Windows "First Last" users).
      # Deploys under a spaced scratch HOME, asserts the generated command
      # is one bash word per token, and executes the deployed settings.json
      # command via `bash -c` from a non-home CWD — the exact 2.1.220 spawn
      # model. CI runner homes have no spaces, so without this step the
      # unquoted-spaced-path 127 class is structurally untestable.
      - name: Spaced-home deploy + execute deployed hook command (M1 class)
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/scratch home
          USERPROFILE: ${{ runner.temp }}/scratch home
        run: |
          mkdir -p "$HOME"
          vibe quickstart --force < /dev/null > "$PWD/spaced-quickstart.txt" 2>&1 || {
            echo "FAIL: quickstart under spaced home"; tail -40 "$PWD/spaced-quickstart.txt"; exit 1
          }
          settings="$HOME/.claude/settings.json"
          test -f "$settings"
          # JSON-level extraction (escaped \" quotes make sed/grep fragile).
          cmd=$(uv run --no-project python -c '
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          stack, out = [data], ""
          while stack:
              node = stack.pop()
              if isinstance(node, dict):
                  stack += list(node.values())
              elif isinstance(node, list):
                  stack += node
              elif isinstance(node, str) and "vibesop-route.sh" in node and node.lstrip().startswith("bash"):
                  out = node
                  break
          print(out)
          ' "$settings")
          [ -n "$cmd" ] || { echo "FAIL: no vibesop-route.sh command found in $settings"; exit 1; }
          echo "deployed command: $cmd"
          path_part=${cmd#bash }
          if [ "$path_part" != "${path_part// /}" ]; then
            case "$path_part" in
              '"'*'"') ;;
              *) echo "FAIL: spaced script path must be quoted as one bash word: $cmd"; exit 1 ;;
            esac
          else
            case "$path_part" in
              '"'*) echo "FAIL: space-free path must stay unquoted: $cmd"; exit 1 ;;
            esac
          fi
          printf '%s\n' '{"prompt":"help me write a commit message","session_id":"e2e-spaced"}' > "$PWD/spaced-in.json"
          rc=0
          bash -c "$cmd" < "$PWD/spaced-in.json" > "$PWD/spaced-out.txt" 2>&1 || rc=$?
          echo "----- spaced-home hook output (rc=$rc) -----"
          cat "$PWD/spaced-out.txt" || true
          if [ "$rc" -eq 127 ] || grep -qi "No such file or directory" "$PWD/spaced-out.txt"; then
            echo "FAIL: deployed command 127s under a spaced home (M1 class)"; exit 1
          fi
          vibe verify claude-code --verbose > "$PWD/spaced-verify.txt" 2>&1 || true
          if grep -qi "unsafe" "$PWD/spaced-verify.txt"; then
            echo "FAIL: vibe verify flags the spaced-home deployment"
            cat "$PWD/spaced-verify.txt"; exit 1
          fi
          echo "SPACED-HOME E2E PASSED"

      - name: Dual-platform injection probe (claude-code vs grok-build)
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/scratch-home
          USERPROFILE: ${{ runner.temp }}/scratch-home
        run: |
          VIBE_BIN="vibe" "$GITHUB_WORKSPACE/scripts/demo/probe-inject.sh" \
            "help me write a commit message" "builtin/commit-message"

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write  # required by actions/attest-build-provenance (F-12, Kimi review #1)

jobs:
  # Gate: Run CI checks before release
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to PyPI
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PYPROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Build package
        run: uv build

      - name: Attest build provenance
        # Generate SLSA build provenance for the dist artifacts (F-12). PyPI
        # package attestations (PEP 740) are emitted separately by the publish
        # action below via Trusted Publishing + id-token: write.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0  # v1.9.0
        with:
          attestations: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a3eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: dist/*

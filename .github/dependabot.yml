version: 2
updates:
  # uv ecosystem updates uv.lock directly (the old "pip" entry only touched
  # pyproject ranges and could not refresh the lockfile — security alerts had
  # to be resolved by hand, e.g. 21b735a).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # 1.x changes the SDK surface (httpx2, opentelemetry). The project
      # bound stays <1.0.0 until that migration is explicit.
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"

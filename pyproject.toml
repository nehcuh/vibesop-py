[project]
name = "vibesop"
version = "8.1.1"
description = "AI SkillOS — discover skills, route queries, orchestrate tasks, manage lifecycles. Unified dashboard, interactive cleanup, community sharing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "nehcuh" }
]
keywords = ["ai", "skillos", "skill-routing", "orchestration", "workflow", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "typer>=0.15.0,<1.0.0",
    "rich>=13.9.0,<14.0.0",
    "ruamel.yaml>=0.18.6,<0.19.0",
    "pyyaml>=6.0.0,<7.0.0",
    "numpy>=1.26.0,<3.0.0",
    "idna>=3.15",
    "packaging>=24.0.0,<25.0.0",
    "httpx>=0.28.0,<1.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "openai>=1.60.0,<2.0.0",
    "questionary>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "jinja2>=3.1.0,<4.0.0",
    # Dashboard (web UI for routing history, traces, conversations, health)
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    # pytest 9.0.3+ fixes CVE-2025-71176 (was pinned <9.0.0).
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",  # 1.x is required for pytest 9
    # pytest plugins required by the suite (previously only in [dependency-groups],
    # which CI's `uv sync --extra dev` did NOT install — causing collection-time
    # failure on @pytest.mark.flaky and the missing `mocker` fixture).
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=16.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "basedpyright>=1.24.0,<2.0.0",
    "pdoc>=16.0.0",
]

test = [
    "vibesop[dev]",
]

semantic = [
    "sentence-transformers>=5.5.0,<6.0.0",
    "numpy>=1.24.0,<3.0.0",
    # FastEmbed: ONNX-based lightweight embeddings (used by W0.C benchmark
    # and W1 embedding cache). Optional because (a) it pulls onnxruntime
    # (~50MB) and (b) most users don't need local embeddings — they hit
    # the API path. Install via `uv sync --extra semantic`.
    # >=0.8.0: 0.4.2 pins pillow<11 and onnx<2 (28 Dependabot CVEs); 0.8
    # relaxes pillow to <13 and drops the direct onnx dependency.
    "fastembed>=0.8.0,<1.0.0",
]

dashboard = [
    # Dependencies moved to core (v8.0.0.dev0) — dashboard works out of the box.
    # Kept as an empty extra for backward compatibility.
]

all = [
    "vibesop[dev,test,semantic,dashboard]",
]

[project.scripts]
vibe = "vibesop.cli.main:app"

[project.urls]
Homepage = "https://github.com/nehcuh/vibesop-py"
Documentation = "https://github.com/nehcuh/vibesop-py#readme"
Repository = "https://github.com/nehcuh/vibesop-py.git"
Issues = "https://github.com/nehcuh/vibesop-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibesop"]

# Bundle the builtin skills (core/skills/) into the wheel so they're available
# on any installation (uv tool / pip / pipx), not just the dev repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"core/skills" = "vibesop/builtin_skills"

# ============================================
# Ruff - Modern Python Linter
# ============================================
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
# .vibe/skills/ holds git-tracked third-party skill content (data, not project
# source) — its scripts are not held to the project's lint/format bar.
extend-exclude = [".vibe"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PL",    # Pylint
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR09",  # too many X
    "PLR2004",  # magic value comparison
    "PLC0415",  # import not at top-level (intentional for lazy loading)
    "RUF001", # ambiguous unicode char in strings (Chinese project)
    "RUF002", # ambiguous unicode char in docstrings
    "RUF003", # ambiguous unicode char in comments
    "TC001",  # move import into type-checking block (false positives with __future__)
    "TC003",  # move stdlib import into type-checking block
    "B008",   # typer uses function calls in argument defaults
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "PLR2004", "ERA001", "PTH", "SIM117"]
"examples/**/*.py" = ["PTH", "ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["vibesop"]
case-sensitive = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================
# Pyright - Type Checker
# ============================================
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"

include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/node_modules",
    "**/.venv",
]

stubPath = "src/stubs"

# Missing type annotations
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportMissingTypeArgument = "warning"
reportArgumentType = "warning"

# Unknown types — disabled because third-party libs (numpy, sklearn, ruamel.yaml)
# lack stubs and produce noise in strict mode. These are not code quality issues.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

# Unused code
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"

# Untyped definitions
reportUntypedFunctionDecorator = "error"
reportUntypedClassDef = "error"
reportUntypedBaseClass = "error"

# Unnecessary code
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "error"

# Relaxed for mixin architecture and optional chaining patterns
reportOptionalMemberAccess = "warning"
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "warning"
reportPrivateUsage = "warning"

# ============================================
# Pytest - Test Framework
# ============================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as benchmark tests",
]

# ============================================
# Bandit - Security Linter (added v7.0.9)
# ============================================
[tool.bandit]
# Only flag MEDIUM and HIGH severity (low is noisy). The CI runs with -ll
# which is equivalent to severity_level=LOW but here we configure the
# default for local runs.
severity = "MEDIUM"
confidence = "MEDIUM"
# Exclude tests, build artifacts, and vendored code.
exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist",
    "src/stubs",
]

# Per-test skips with documented justification. Each skip must reference
# either a fix that landed or an open issue tracking the residual work.
# B324: hashlib MD5/SHA1 used for content addressing (cache keys, skill
#       IDs), not password hashing or other security-sensitive contexts.
#       Adding `usedforsecurity=False` would require Python 3.9+ (we have
#       3.12, but the keyword breaks when callers expect FIPS-compliant
#       behavior). Tracked as a separate cleanup if a security-sensitive
#       hash use case ever emerges.
# B701: jinja2_autoescape_false — autoescape is for HTML; our shell
#       templates are rendered through vibesop.utils.jinja_safety which
#       provides context-specific filters (pyquote/shellquote/shellvar/
#       safe_text) that handle the shell + Python injection surface that
#       autoescape does not address. See v7.0.2.
# B602: subprocess_popen_with_shell_equals_true — was being skipped until
#       v7.0.12 fixed prompt_chain/validator.py local mode by switching
#       from shell=True to ["bash", "-c", cmd] list form. Kept here as
#       documentation; if any new shell=True re-emerges, CI will fail
#       (this skip is no longer applied — see ci.yml).
# B608: hardcoded_sql_expressions — sole hit is installer/init_support.py:234,
#       an f-string *TOML config template* (not SQL); confidence Low. No SQL
#       is constructed anywhere in the codebase.
skips = ["B324", "B701", "B608"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

# ============================================
# Coverage
# ============================================
[tool.coverage.run]
source = ["src"]
branch = true
# NOTE: `parallel = true` was removed — with branch=true it raised
# coverage.exceptions.DataError "Can't combine statement coverage data with
# branch data" under `pytest --cov` (CI's Test job, and locally). CI's test job
# runs single-process (no -n/xdist), so parallel data files aren't needed.
omit = [
    "*/__init__.py",
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
# NOTE: baseline ~73% for the non-benchmark/non-slow suite (CI runs
# `pytest -m "not benchmark and not slow"`; the flaky benchmark/slow tests
# that the full suite includes contribute ~3% more). Aligned with the CI gate.
fail_under = 73
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Dev tooling lives in [project.optional-dependencies].dev above — single source.
# (The previous duplicate [dependency-groups].dev diverged from it, which is what
# broke CI's test job: `uv sync --extra dev` installed the extra but not the
# group's pytest plugins.)


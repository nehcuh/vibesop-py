# .vibe/config.toml — VibeSOP project-level configuration
platform = "claude-code"

[routing]
min_confidence = 0.6
enable_ai_triage = true
enable_embedding = false
max_candidates = 3
confirmation_mode = "always"
degradation_enabled = true
degradation_auto_threshold = 0.6
degradation_suggest_threshold = 0.4
degradation_degrade_threshold = 0.2
degradation_fallback_always_ask = true
session_aware = true

[orchestration]
enabled = true

[security]
threat_level = "medium"
scan_external = true

[skills]
namespaces = ["builtin", "omx", "superpowers", "cross-cutting"]

[skills.namespace_priorities]
# Cross-cutting project skills have highest priority
# builtin provides core workflow; omx/superpowers provide specialized packs
cross-cutting = 110
builtin = 100
omx = 95
superpowers = 80
project = 100

[preferences]
learning_enabled = true

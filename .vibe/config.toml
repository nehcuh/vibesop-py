# .vibe/config.toml — VibeSOP project-level configuration
platform = "claude-code"

[routing]
min_confidence = 0.6
enable_ai_triage = true
enable_embedding = false
max_candidates = 3
confirmation_mode = "always"
degradation_enabled = true
degradation_auto_threshold = 0.6
degradation_suggest_threshold = 0.4
degradation_degrade_threshold = 0.2
degradation_fallback_always_ask = true
session_aware = true

[orchestration]
enabled = false

[security]
threat_level = "medium"
scan_external = true

[skills]
namespaces = ["builtin", "omx", "superpowers", "cross-cutting"]

[skills.namespace_priorities]
# Cross-cutting project skills have highest priority
# builtin provides core workflow; omx/superpowers provide specialized packs
cross-cutting = 110
builtin = 100
omx = 95
superpowers = 80
project = 100

[analytics]
enabled = false

[preferences]
learning_enabled = true

[loop]
# Master switch — must be true for `vibe loop tick` to actually execute.
# Default false is intentional (prevents accidental LLM spend). Flip back to false to kill all loops.
enabled = true
default_tick_seconds = 60
max_active_loops = 20

[conversation_mirror]
# Mirror Claude Code conversations into .vibe/conversations/ for dashboard.
# Default false — opt-in (mirror captures user prompts which may contain secrets).
# Hooks shipped: vibesop-mirror-prompt.sh (UserPromptSubmit), vibesop-mirror-session-end.sh (SessionEnd).
enabled = true
